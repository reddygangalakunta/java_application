name: CI/CD Pipeline

on:
  push:
    branches:
      - feature1
  pull_request:
    branches:
      - feature1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Build user-service
      run: |
        cd user-service
        mvn clean package

    - name: Build order-service
      run: |
        cd order-service
        mvn clean package

    - name: Build product-service
      run: |
        cd product-service
        mvn clean package

    - name: Build inventory-service
      run: |
        cd inventory-service
        mvn clean package

    - name: Build payment-service
      run: |
        cd payment-service
        mvn clean package

  docker-build:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Build Docker images
      run: |
        docker build -t user-service:latest -f user-service/Dockerfile user-service
        docker build -t order-service:latest -f order-service/Dockerfile order-service
        docker build -t product-service:latest -f product-service/Dockerfile product-service
        docker build -t inventory-service:latest -f inventory-service/Dockerfile inventory-service
        docker build -t payment-service:latest -f payment-service/Dockerfile payment-service

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

    - name: Deploy with Docker Compose
      run: docker-compose up -d

    - name: Wait for services to be ready
      run: sleep 30

    - name: Run tests
      run: |
        curl -f http://localhost:8081/users
        curl -f http://localhost:8082/orders
        curl -f http://localhost:8083/products
        curl -f http://localhost:8084/inventory
        curl -f http://localhost:8085/payments

    - name: Tear down services
      if: always()
      run: docker-compose down
